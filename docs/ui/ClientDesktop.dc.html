<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Galeri klien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121517}
a{color:#a6ddd6;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 100vh; font-family: Archivo, system-ui, sans-serif; color: #e8ecec; background: #121517; display: flex; flex-direction: column">
  <header style="background: #1b2023; position: relative">
    <div style="max-width: 1400px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="https://johorstudio.com"><img src="/_blob/74c451021d4a35d09593e5b5a7b7fc56" alt="JohorStudio.com" style="width: 120px; height: auto; display: block"></a>
      <div style="display: flex; align-items: center; gap: 4px">
        <a href="ShareSheet.dc.html" aria-label="Kongsi album ni" title="Kongsi album ni" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg></a>
        <a href="ClientFav.dc.html" aria-label="Favourite, 12 gambar" title="Favourite" style="width: 48px; height: 48px; border-radius: 24px; color: #d7dddf; display: flex; align-items: center; justify-content: center; position: relative">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
          <span style="position: absolute; top: 6px; right: 4px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #ef6b62; color: #121517; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">12</span></a>
        <button type="button" aria-label="Download semua (ZIP)" title="Download semua (ZIP)" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4 4 0 0 1 0 9"/><path d="M12 11v9"/><path d="m9 17 3 3 3-3"/></svg></button>
        <button type="button" aria-label="Lagi" aria-expanded="true" title="Lagi" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: #2c3438; color: #d7dddf; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
      </div>
    </div>
    <div role="menu" aria-label="Lagi" style="position: absolute; right: max(20px, calc((100% - 1400px) / 2 + 20px)); top: 64px; z-index: 2; width: 260px; background: #262d31; border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.45); font-size: 15px">
      <a role="menuitem" href="ClientFav.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #e8ecec">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4 4 0 0 1 0 9"/><path d="M12 11v9"/><path d="m9 17 3 3 3-3"/></svg>Download favourite (ZIP)</a>
      <a role="menuitem" href="https://johorstudio.com" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #e8ecec">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></svg>Pergi ke JohorStudio.com</a>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 28px 20px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="ClientPortal.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #a6ddd6">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Tadika Mawar</a>
      <h1 style="margin: 0; font-size: 40px; font-weight: 700; font-stretch: 78%; line-height: 1; color: #ffffff">Konvo 2026</h1>
      <span style="font-size: 15px; color: #a3aeb2">1,102 gambar · 22 Nov 2026</span>
    </div>
    <div role="tablist" aria-label="Kamera" style="display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid #262d31; padding-bottom: 12px">
      <button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 16px; border: 0; border-radius: 20px; background: #e8ecec; color: #121517; font: inherit; font-size: 14px; font-weight: 600">Semua · 1,102</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 16px; border: 1px solid #3a454b; border-radius: 20px; background: transparent; color: #d7dddf; font: inherit; font-size: 14px">Cam 1 · 640</button>
      <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 16px; border: 1px solid #3a454b; border-radius: 20px; background: transparent; color: #d7dddf; font: inherit; font-size: 14px">Cam 2 · 462</button>
    </div>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600; color: #d7dddf">{{d.label}}</h2>
        <sc-for list="{{d.rows}}" as="row" hint-placeholder-count="2">
          <div style="display: flex; gap: 4px">
            <sc-for list="{{row}}" as="t" hint-placeholder-count="5">
              <a href="ClientViewer.dc.html" aria-label="Buka gambar" style="flex: {{t.g}} 1 0; min-width: 0; height: 200px; background: {{t.c}}; position: relative; display: block">
                <sc-if value="{{t.fav}}" hint-placeholder-val="{{ false }}">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="1.8" aria-hidden="true" style="position: absolute; left: 8px; top: 8px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6))"><path d="M12 21s-7-4.4-9.3-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
                </sc-if>
              </a>
            </sc-for>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <footer style="border-top: 1px solid #262d31; padding: 20px; text-align: center; font-size: 13px; color: #a3aeb2">Gambar oleh <a href="https://johorstudio.com">JohorStudio.com</a></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const pal = ['#5d5650','#4a5257','#55615c','#6b625a','#3d4549','#625850','#59625f','#4c5a54','#6e665c','#434c51','#5f564d','#535c59'];
    let s = 21;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const row = (n) => Array.from({ length: n }, () => ({ g: [2, 3, 3, 4, 4.5][Math.floor(rnd() * 5)], c: pal[Math.floor(rnd() * pal.length)], fav: rnd() > 0.8 }));
    return {
      days: [
        { label: '9:00 pagi', rows: [row(6), row(5)] },
        { label: '11:00 pagi', rows: [row(6)] }
      ]
    };
  }
}
</script>
</body>
</html>
