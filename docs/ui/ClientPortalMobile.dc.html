<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Portal klien phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a6ddd6;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: Archivo, system-ui, sans-serif; color: #e8ecec; background: #121517; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 8px 14px; background: #1b2023">
    <img src="/_blob/74c451021d4a35d09593e5b5a7b7fc56" alt="JohorStudio.com" style="width: 92px; height: auto">
    <button type="button" aria-label="Lagi" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </header>
  <div style="padding: 20px 14px 14px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #a3aeb2">GALERI KLIEN</span>
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; font-stretch: 78%; line-height: 1; color: #ffffff">Tadika Mawar</h1>
    <span style="font-size: 14px; color: #a3aeb2">4 album · 3,412 gambar</span>
  </div>
  <div style="padding: 0 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px">
    <sc-for list="{{albums}}" as="a" hint-placeholder-count="4">
      <div style="position: relative; display: flex; flex-direction: column; gap: 8px">
        <a href="ClientMobile.dc.html" aria-label="Buka album {{a.title}}" style="display: block; height: 170px; border-radius: 8px; background: {{a.c1}}"></a>
        <a href="ShareSheet.dc.html" aria-label="Kongsi album {{a.title}}" style="position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border-radius: 22px; background: rgba(18,21,23,0.75); color: #ffffff; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg></a>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <a href="ClientMobile.dc.html" style="font-size: 15px; font-weight: 600; color: #ffffff">{{a.title}}</a>
          <span style="font-size: 13px; color: #a3aeb2">{{a.meta}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      albums: [
        { title: 'Konvo 2026', meta: '1,102 gambar · 2 kamera', c1: '#5d5650' },
        { title: 'Hari Sukan 2026', meta: '980 gambar', c1: '#55615c' },
        { title: 'Sambutan Raya 2026', meta: '620 gambar', c1: '#6e665c' },
        { title: 'Hari Guru 2026', meta: '710 gambar · 2 kamera', c1: '#4c5a54' }
      ]
    };
  }
}
</script>
</body>
</html>
