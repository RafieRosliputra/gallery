<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Favourite klien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a6ddd6;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: Archivo, system-ui, sans-serif; color: #e8ecec; background: #121517; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; background: #1b2023">
    <div style="display: flex; align-items: center; gap: 2px">
      <a href="ClientMobile.dc.html" aria-label="Kembali ke galeri" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #d7dddf">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
      <h1 style="margin: 0; font-size: 19px; font-weight: 600; color: #ffffff">Favourite (12)</h1>
    </div>
    <div style="display: flex; align-items: center">
      <button type="button" aria-label="Download 12 favourite (ZIP)" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4 4 0 0 1 0 9"/><path d="M12 11v9"/><path d="m9 17 3 3 3-3"/></svg></button>
      <button type="button" aria-label="Lagi" aria-expanded="true" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #2c3438; color: #d7dddf; display: flex; align-items: center; justify-content: center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </div>
  </header>

  <div style="position: relative">
    <div role="menu" aria-label="Lagi" style="position: absolute; right: 8px; top: 4px; z-index: 2; width: 220px; background: #262d31; border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.5); font-size: 15px">
      <button type="button" role="menuitem" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; background: transparent; color: #e8ecec; font: inherit; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Kosongkan senarai</button>
    </div>
  </div>

  <div style="margin: 14px; padding: 12px 14px; background: #1d3532; border-radius: 6px; font-size: 14px; line-height: 1.4; color: #cdeee9">Pilihan disimpan dalam browser ni sahaja. Buka link di phone lain, senarai akan kosong.</div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
    <div style="display: flex; gap: 2px; height: {{r.h}}px">
    <sc-for list="{{r.tiles}}" as="t" hint-placeholder-count="3">
      <a href="ClientViewer.dc.html" aria-label="{{t.label}}" style="flex: {{t.ar}} 1 0; min-width: 0; background: {{t.c}}; position: relative; display: block">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="1.8" aria-hidden="true" style="position: absolute; left: 6px; top: 6px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6))"><path d="M12 21s-7-4.4-9.3-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
      </a>
    </sc-for>
    </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pal = ['#5d5650','#4a5257','#55615c','#6b625a','#3d4549','#625850','#59625f','#4c5a54','#6e665c','#434c51','#5f564d','#535c59'];
    const AR = { P: 2 / 3, L: 3 / 2 };
    const pattern = [['L', 'P', 'P'], ['L', 'L'], ['P', 'L', 'P'], ['P', 'P', 'L']];
    let i = 0;
    const rows = pattern.map((p) => {
      const tiles = p.map((o) => {
        const k = i++;
        return { ar: AR[o], c: pal[(k * 7 + 2) % pal.length], label: o === 'P' ? 'Buka gambar menegak' : 'Buka gambar melintang' };
      });
      const sum = tiles.reduce((a, t) => a + t.ar, 0);
      return { tiles, h: Math.round((390 - 2 * (tiles.length - 1)) / sum) };
    });
    return { rows };
  }
}
</script>
</body>
</html>
