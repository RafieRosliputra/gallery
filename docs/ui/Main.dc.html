<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Admin Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f7f7}
a{color:#1f6f68;text-decoration:none}a:hover{color:#20272b}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: Archivo, system-ui, sans-serif; color: #20272b; background: #f5f7f7">
  <nav aria-label="Menu admin" style="flex: 1 1 220px; max-width: 100%; background: #20272b; color: #ffffff; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <img src="/_blob/74c451021d4a35d09593e5b5a7b7fc56" alt="JohorStudio.com" style="width: 150px; height: auto; margin-left: 8px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; background: #1f6f68; color: #ffffff; font-weight: 600; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Timeline</a>
      <a href="Albums.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; color: #e2e8e9; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h18v13H3z"/><path d="M7 4h10"/></svg>Album</a>
      <a href="Links.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; color: #e2e8e9; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Klien</a>
      <a href="Status.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 6px; color: #e2e8e9; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Status sistem</a>
    </div>
    <div style="margin-top: auto; background: #2c353a; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
      <div style="display: flex; justify-content: space-between"><span>Hot cache SSD</span><span style="font-weight: 600">42 / 80 GB</span></div>
      <div style="height: 6px; background: #46525a; border-radius: 3px"><div style="width: 52%; height: 6px; background: #a6ddd6; border-radius: 3px"></div></div>
      <span style="color: #c3ccce">Simpan 30 hari, lepas tu buang auto</span>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; font-stretch: 85%; letter-spacing: -0.01em">Timeline</h1>
      <div role="group" aria-label="Mod paparan" style="display: flex; background: #e2e8e9; border-radius: 6px; padding: 3px">
        <a href="Main.dc.html" style="padding: 8px 16px; border-radius: 4px; background: #ffffff; color: #20272b; font-weight: 600; font-size: 14px">Tarikh</a>
        <a href="Folders.dc.html" style="padding: 8px 16px; border-radius: 4px; color: #4f5b61; font-size: 14px">Folder</a>
      </div>
      <label style="flex: 1 1 240px; display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #d3dadc; border-radius: 6px; padding: 0 12px; height: 42px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#66737a" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" aria-label="Cari" placeholder="Cari nama fail atau tarikh" style="border: 0; outline: 0; flex: 1; font: inherit; font-size: 14px; background: transparent">
      </label>
      <button type="button" style="height: 42px; padding: 0 16px; border: 0; border-radius: 6px; background: #20272b; color: #ffffff; font: inherit; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Imbas semula</button>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: #4f5b61">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1f6f68"></span>128,402 gambar</span>
      <span>Thumbnail dalam giliran: 312</span>
      <span>Imbas terakhir: 22:31</span>
    </div>

    <div style="display: flex; gap: 24px; align-items: flex-start">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 28px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
          <section style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
              <h2 style="margin: 0; font-size: 17px; font-weight: 600">{{d.label}}</h2>
              <span style="font-size: 13px; color: #4f5b61">{{d.sub}}</span>
            </div>
            <sc-for list="{{d.rows}}" as="row" hint-placeholder-count="2">
              <div style="display: flex; gap: 4px">
                <sc-for list="{{row}}" as="t" hint-placeholder-count="5">
                  <div style="flex: {{t.g}} 1 0; min-width: 0; height: 150px; background: {{t.c}}; border-radius: 2px"></div>
                </sc-for>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
      <nav aria-label="Lompat ikut bulan" style="flex: 0 0 64px; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: #4f5b61; text-align: right">
        <span style="font-weight: 700; color: #20272b">2026</span>
        <a href="#" style="color: #1f6f68; font-weight: 600">Nov</a>
        <a href="#" style="color: #4f5b61">Okt</a>
        <a href="#" style="color: #4f5b61">Sep</a>
        <a href="#" style="color: #4f5b61">Ogo</a>
        <a href="#" style="color: #4f5b61">Jul</a>
        <span style="font-weight: 700; color: #20272b; margin-top: 8px">2025</span>
        <a href="#" style="color: #4f5b61">Dis</a>
        <a href="#" style="color: #4f5b61">Nov</a>
      </nav>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    const pal = ['#c9bfb4','#8f9aa0','#b7c4bf','#d8cfc4','#6f7b80','#a99c8f','#cfd8d6','#9fb0a8','#e0d6c8','#7d8a8f','#b9aea2','#c4ccc9'];
    let s = 7;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const row = (n) => Array.from({ length: n }, () => ({ g: [2, 3, 3, 4, 4.5][Math.floor(rnd() * 5)], c: pal[Math.floor(rnd() * pal.length)] }));
    return {
      days: [
        { label: 'Isnin, 24 Nov 2026', sub: 'CLIENT / Konvo Tadika Mawar · 1,284 gambar', rows: [row(7), row(6)] },
        { label: 'Sabtu, 22 Nov 2026', sub: 'CLIENT / Majlis Kahwin Aina & Hafiz · 864 gambar', rows: [row(6), row(7)] },
        { label: 'Rabu, 19 Nov 2026', sub: 'PORTFOLIO / Studio fesyen · 212 gambar', rows: [row(5)] }
      ]
    };
  }
}
</script>
</body>
</html>
