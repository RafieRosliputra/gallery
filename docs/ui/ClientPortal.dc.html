<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Portal klien</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121517}
a{color:#a6ddd6;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 100vh; font-family: Archivo, system-ui, sans-serif; color: #e8ecec; background: #121517; display: flex; flex-direction: column">
  <header style="background: #1b2023">
    <div style="max-width: 1400px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <a href="https://johorstudio.com"><img src="/_blob/74c451021d4a35d09593e5b5a7b7fc56" alt="JohorStudio.com" style="width: 120px; height: auto; display: block"></a>
      <button type="button" aria-label="Lagi" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 36px 20px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #a3aeb2">GALERI KLIEN</span>
      <h1 style="margin: 0; font-size: 48px; font-weight: 700; font-stretch: 78%; line-height: 1; color: #ffffff">Tadika Mawar</h1>
      <span style="font-size: 15px; color: #a3aeb2">4 album · 3,412 gambar</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px">
      <sc-for list="{{albums}}" as="a" hint-placeholder-count="4">
        <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
          <a href="ClientDesktop.dc.html" aria-label="Buka album {{a.title}}" style="display: flex; gap: 3px; height: 210px; border-radius: 8px; overflow: hidden">
            <div style="flex: 3 1 0; background: {{a.c1}}"></div>
            <div style="flex: 2 1 0; display: flex; flex-direction: column; gap: 3px">
              <div style="flex: 1; background: {{a.c2}}"></div>
              <div style="flex: 1; background: {{a.c3}}"></div>
            </div>
          </a>
          <a href="ShareSheet.dc.html" aria-label="Kongsi album {{a.title}}" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 22px; background: rgba(18,21,23,0.75); color: #ffffff; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg></a>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <a href="ClientDesktop.dc.html" style="font-size: 18px; font-weight: 600; color: #ffffff">{{a.title}}</a>
            <span style="font-size: 14px; color: #a3aeb2">{{a.meta}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </main>

  <footer style="border-top: 1px solid #262d31; padding: 20px; text-align: center; font-size: 13px; color: #a3aeb2">Gambar oleh <a href="https://johorstudio.com">JohorStudio.com</a></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      albums: [
        { title: 'Konvo 2026', meta: '22 Nov 2026 · 1,102 gambar · 2 kamera', c1: '#5d5650', c2: '#4a5257', c3: '#6b625a' },
        { title: 'Hari Sukan 2026', meta: '14 Sep 2026 · 980 gambar', c1: '#55615c', c2: '#625850', c3: '#3d4549' },
        { title: 'Sambutan Raya 2026', meta: '18 Apr 2026 · 620 gambar', c1: '#6e665c', c2: '#59625f', c3: '#434c51' },
        { title: 'Hari Guru 2026', meta: '16 Mei 2026 · 710 gambar · 2 kamera', c1: '#4c5a54', c2: '#5f564d', c3: '#535c59' }
      ]
    };
  }
}
</script>
</body>
</html>
