<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Galeri klien phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#a6ddd6;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: Archivo, system-ui, sans-serif; color: #e8ecec; background: #121517; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 8px 6px 8px 8px; background: #1b2023">
    <a href="ClientPortalMobile.dc.html" style="display: flex; align-items: center; gap: 4px; min-height: 44px; color: #a6ddd6; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Tadika Mawar</a>
    <div style="display: flex; align-items: center">
      <a href="ShareSheet.dc.html" aria-label="Kongsi album ni" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg></a>
      <a href="ClientFav.dc.html" aria-label="Favourite, 12 gambar" style="width: 44px; height: 44px; border-radius: 22px; color: #d7dddf; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
        <span style="position: absolute; top: 4px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #ef6b62; color: #121517; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">12</span></a>
      <button type="button" aria-label="Download semua (ZIP)" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4 4 0 0 1 0 9"/><path d="M12 11v9"/><path d="m9 17 3 3 3-3"/></svg></button>
      <button type="button" aria-label="Lagi" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: #d7dddf; display: flex; align-items: center; justify-content: center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
    </div>
  </header>
  <div style="padding: 16px 14px 10px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; font-stretch: 78%; line-height: 1.05; color: #ffffff">Konvo 2026</h1>
    <span style="font-size: 14px; color: #a3aeb2">1,102 gambar · 22 Nov 2026</span>
  </div>
  <div role="tablist" aria-label="Kamera" style="display: flex; gap: 8px; padding: 0 14px 12px">
    <button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: #e8ecec; color: #121517; font: inherit; font-size: 14px; font-weight: 600">Semua</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border: 1px solid #3a454b; border-radius: 20px; background: transparent; color: #d7dddf; font: inherit; font-size: 14px">Cam 1 · 640</button>
    <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border: 1px solid #3a454b; border-radius: 20px; background: transparent; color: #d7dddf; font: inherit; font-size: 14px">Cam 2 · 462</button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
    <div style="display: flex; gap: 2px; height: {{r.h}}px">
    <sc-for list="{{r.tiles}}" as="t" hint-placeholder-count="3">
      <a href="ClientViewer.dc.html" aria-label="{{t.label}}" style="flex: {{t.ar}} 1 0; min-width: 0; background: {{t.c}}; position: relative; display: block">
        <sc-if value="{{t.fav}}" hint-placeholder-val="{{ false }}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff" stroke="#ffffff" stroke-width="1.8" aria-hidden="true" style="position: absolute; left: 6px; top: 6px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6))"><path d="M12 21s-7-4.4-9.3-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.3 6c-2.3 4.6-9.3 9-9.3 9z"/></svg>
        </sc-if>
      </a>
    </sc-for>
    </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pal = ['#5d5650','#4a5257','#55615c','#6b625a','#3d4549','#625850','#59625f','#4c5a54','#6e665c','#434c51','#5f564d','#535c59'];
    // P = menegak 2:3, L = melintang 3:2. Tinggi baris dikira supaya lebar penuh 390px tanpa crop.
    const AR = { P: 2 / 3, L: 3 / 2 };
    const pattern = [['P', 'P', 'L'], ['L', 'L'], ['P', 'P', 'P'], ['L', 'P'], ['P', 'L', 'P'], ['L', 'L']];
    const favs = [1, 6, 10];
    let i = 0;
    const rows = pattern.map((p) => {
      const tiles = p.map((o) => {
        const k = i++;
        return { ar: AR[o], c: pal[(k * 5 + 3) % pal.length], fav: favs.includes(k), label: o === 'P' ? 'Buka gambar menegak' : 'Buka gambar melintang' };
      });
      const sum = tiles.reduce((a, t) => a + t.ar, 0);
      return { tiles, h: Math.round((390 - 2 * (tiles.length - 1)) / sum) };
    });
    return { rows };
  }
}
</script>
</body>
</html>
