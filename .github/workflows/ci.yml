name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
          POSTGRES_DB: gallery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallery -d gallery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gallery:gallery@127.0.0.1:5432/gallery_test
      R2_ENDPOINT: http://127.0.0.1:9000
      R2_BUCKET: gallery-thumbs
      R2_ACCESS_KEY_ID: gallery
      R2_SECRET_ACCESS_KEY: gallery-secret
      R2_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # MinIO's public images are no longer pullable (quay.io 401 / Docker Hub
      # removed); moto exposes the same S3 API and keeps Cache-Control/Content-Type.
      - name: Start S3-compatible storage (moto)
        run: |
          docker run -d --name s3 -p 9000:5000 motoserver/moto:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs s3
          exit 1

      - name: Test (Postgres 16 + S3, R2 path)
        run: npm test

      - name: Perf report (not a gate)
        run: node scripts/perf.mjs

      - name: Build image (linux/amd64)
        run: docker build --platform linux/amd64 -t gallery:ci .

      - name: Format check (inside built image)
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgres://gallery:gallery@127.0.0.1:5432/gallery_test
          gallery:ci node scripts/format-check.mjs

      # Boots the real production image against the Postgres service: migrations,
      # SPA at /s, seeded album, API health. Not a browser run.
      - name: Image smoke (real image + seeded Postgres)
        run: |
          set -euo pipefail
          cleanup() {
            docker logs gallery-smoke 2>&1 | tail -40 || true
            docker rm -f gallery-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Integration tests leave fixtures in the shared slug namespace.
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            gallery:ci node scripts/reset-smoke.mjs

          docker run -d --name gallery-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e APP_VERSION=ci-smoke \
            -e SCAN_INTERVAL_MIN=0 \
            gallery:ci

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/s/api/health >/tmp/health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done

          docker exec gallery-smoke node /app/scripts/seed-smoke.mjs

          test "$(curl -s -o /tmp/root.html -w '%{http_code}' http://127.0.0.1:3000/s)" = 200
          grep -qi '<title>' /tmp/root.html
          grep -qi 'content-security-policy' /tmp/root.html
          echo "GET /s -> 200 html title+CSP ok"

          test "$(curl -s -o /tmp/deep.html -w '%{http_code}' http://127.0.0.1:3000/s/tadika-contoh)" = 200
          grep -qi '<title>' /tmp/deep.html
          echo "GET /s/tadika-contoh -> 200 html title ok"

          curl -fsS http://127.0.0.1:3000/s/api/health | tee /tmp/health.json
          grep -q '"db":"up"' /tmp/health.json
          echo "GET /s/api/health -> json db up"

          curl -fsS http://127.0.0.1:3000/s/api/resolve/tadika-contoh | tee /tmp/resolve.json
          grep -q '"kind":"album"' /tmp/resolve.json
          curl -fsS http://127.0.0.1:3000/s/api/album/tadika-contoh | tee /tmp/album.json
          grep -q '"total":1' /tmp/album.json
          echo "seeded album tadika-contoh -> resolve 200, total 1"

          test "$(curl -s -o /tmp/xyz.html -w '%{http_code}' http://127.0.0.1:3000/s/xyz)" = 200
          grep -qi '<title>' /tmp/xyz.html
          echo "GET /s/xyz -> 200 html (SPA fallback)"

          test "$(curl -s -o /tmp/api-miss -w '%{http_code}' http://127.0.0.1:3000/s/api/nope)" = 404
          ! grep -qi '<title>' /tmp/api-miss
          echo "GET /s/api/nope -> 404 json (no SPA fallback)"

      - name: Report image size
        run: |
          docker image inspect -f '{{.Size}}' gallery:ci \
            | awk '{printf "image size: %.1f MiB (%d bytes)\n", $1/1048576, $1}'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/rafierosliputra/gallery
          docker tag gallery:ci "$IMAGE:${GITHUB_SHA}"
          docker tag gallery:ci "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        run: npm ci
      - name: Typecheck worker
        run: npm run typecheck
      - name: Test worker (miniflare R2 + proxy + secrets)
        run: npm test
  web:
    runs-on: ubuntu-latest
    env:
      # CI builds the SPA against MSW fixtures so screenshots are deterministic.
      VITE_MOCKS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck web (svelte-check)
        run: npm run check:web

      - name: Web unit tests (vitest)
        run: npm run test:web

      - name: Build SPA (/s, static fallback)
        run: npm run build:web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke + screenshots
        run: npm run test:e2e

      - name: Upload route screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: apps/web/test-results/screenshots
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
