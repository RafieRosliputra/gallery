name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
          POSTGRES_DB: gallery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallery -d gallery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gallery:gallery@127.0.0.1:5432/gallery_test
      R2_ENDPOINT: http://127.0.0.1:9000
      R2_BUCKET: gallery-thumbs
      R2_ACCESS_KEY_ID: gallery
      R2_SECRET_ACCESS_KEY: gallery-secret
      R2_REGION: us-east-1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # MinIO's public images are no longer pullable (quay.io 401 / Docker Hub
      # removed); moto exposes the same S3 API and keeps Cache-Control/Content-Type.
      - name: Start S3-compatible storage (moto)
        run: |
          docker run -d --name s3 -p 9000:5000 motoserver/moto:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs s3
          exit 1

      - name: Test (Postgres 16 + S3, R2 path)
        run: npm test

      - name: Perf report (not a gate)
        run: node scripts/perf.mjs

      - name: Build image (linux/amd64)
        run: docker build --platform linux/amd64 -t gallery:ci .

      - name: Format check (inside built image)
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgres://gallery:gallery@127.0.0.1:5432/gallery_test
          gallery:ci node scripts/format-check.mjs

      - name: Report image size
        run: |
          docker image inspect -f '{{.Size}}' gallery:ci \
            | awk '{printf "image size: %.1f MiB (%d bytes)\n", $1/1048576, $1}'

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/rafierosliputra/gallery
          docker tag gallery:ci "$IMAGE:${GITHUB_SHA}"
          docker tag gallery:ci "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker deps
        run: npm ci
      - name: Typecheck worker
        run: npm run typecheck
      - name: Test worker (miniflare R2 + proxy + secrets)
        run: npm test
